<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게임 밸런스 관리</title><link rel="stylesheet" href="game-admin.css"></head><body data-page="game-admin"><main><a href="game.html">← 게임으로 돌아가기</a><h1>게임 밸런스 관리</h1><p data-game-role>게스트</p><p data-guest-only>관리자 전용 페이지입니다. 메인 페이지에서 관리자로 로그인해주세요. <a href="index.html">로그인하러 가기</a></p><section data-game-admin hidden><p>관리자 테스트 플레이: 무적 · 공격력 999<br>아래 플레이어 체력·공격력은 게스트에게 적용됩니다.</p><form id="balanceForm"><label>플레이어 기본 체력<input name="player_hp" type="number" min="1" max="10000" required></label><label>플레이어 기본 공격력<input name="player_damage" type="number" min="1" max="999" required></label><label>플레이어 이동속도<input name="player_speed" type="number" min="50" max="1000" required></label><label>모든 적 체력·공격력 배율<input name="enemy_multiplier" type="number" min="0.1" max="20" step="0.1" required></label><label>일반 적 생성 간격 (밀리초)<input name="spawn_ms" type="number" min="100" max="10000" required></label><button type="submit">저장</button> <button id="balanceReset" type="button">기본값 입력</button><p id="balanceStatus" role="status"></p></form></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="game-access.js?v=admin-link-fix-20260930"></script></body></html>
